<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="#060913" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
  
  <!-- Cyber V Monogram -->
  <path d="M16 18 L32 46 L48 18" fill="none" stroke="url(#cyber-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
  
  <!-- Glowing Center Node -->
  <circle cx="32" cy="46" r="3.5" fill="#38bdf8" filter="url(#neon-glow)" />
</svg>
